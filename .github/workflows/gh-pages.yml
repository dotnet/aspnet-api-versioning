name: Deploy

# REF: https://github.com/rust-lang/mdBook/wiki/Automated-Deployment%3A-GitHub-Actions

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Latest mdBook
      run: |
        tag=$(curl 'https://api.github.com/repos/rust-lang/mdbook/releases/latest' | jq -r '.tag_name')
        url="https://github.com/rust-lang/mdbook/releases/download/${tag}/mdbook-${tag}-x86_64-unknown-linux-gnu.tar.gz"
        mkdir mdbook
        curl -sSL $url | tar -xz --directory=./mdbook
        echo `pwd`/mdbook >> $GITHUB_PATH

    - name: Build Documentation
      run: |
        cd wiki
        mdbook build

    # mdBook rewrites .md links to .html without verifying the target exists, so a
    # renamed or removed page builds cleanly and 404s in production. This also checks
    # that the legacy wiki redirect map still resolves.
    - name: Check Links
      shell: pwsh
      run: ./wiki/tools/Test-Links.ps1 -Book ./wiki/book -MapPath ./wiki/tools/wiki-redirect-map.tsv

    - name: Deploy GitHub Pages
      run: |
        cd wiki
        git worktree add gh-pages
        git config user.name "GitHub Pages from CI"
        git config user.email ""
        cd gh-pages
        # Delete the ref to avoid keeping history
        git update-ref -d refs/heads/gh-pages
        rm -rf *
        mv ../book/* .
        git add .
        git commit -m "Deploy $GITHUB_SHA to gh-pages"
        git push --force --set-upstream origin gh-pages